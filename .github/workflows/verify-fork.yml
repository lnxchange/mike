# Typecheck / build for PRs into the working branch.
# Upstream CI already covers PRs into main. This job is the required check
# that auto-merge of upstream-sync PRs into the working branch waits on.
name: Fork verify

on:
  pull_request:
    branches: ["cursor/setup-supabase-vercel-oss-cad9"]

# Least privilege for the job token: checkout and npm only.
permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        include:
          - workspace: Backend
            dir: backend
          - workspace: Frontend
            dir: frontend
    name: ${{ matrix.workspace }} verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - name: Validate package.json and lockfile parse
        run: node -e "for (const f of ['package.json','package-lock.json']) JSON.parse(require('fs').readFileSync(f, 'utf8'))"
      - run: npm ci
      - run: npm run verify
